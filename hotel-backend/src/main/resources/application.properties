spring.application.name=hotel-backend
server.port=8081

# TimeZone Setting
spring.jackson.time-zone=Asia/Taipei

# Product image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Spring Security
spring.security.user.name=user
spring.security.user.password=1234


# JWT 密鑰
jwt.secret-key=${JWT_SECRET_KEY:myCustomSuperSecretKeyForJWTAuthenticationThatIsLongEnough123456}
jwt.valid-seconds=${JWT_VALID_SECONDS:86400}


#SQL Server DataSource Setting
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=finalproject;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


#Spring Data JPA Setting
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Actuator
management.endpoints.web.base-path=/api/actuator

# Test
logging.level.org.springframework.security=TRACE

# Spring Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:xingchenghotel2026@gmail.com}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google Cloud Storage (GCS)
spring.cloud.gcp.credentials.location=classpath:starlight-hotel-bbba90b91e92.json

# Hotel Business Configuration
hotel.default.housekeeper.id=13

# ECPay Stage Configuration
ecpay.stage.url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5
ecpay.stage.merchant-id=3002607
ecpay.stage.hash-key=pwFHCqoQZGmho4w6
ecpay.stage.hash-iv=EkRm7iFT261dpevs
# 綠界付款回傳網址 (背景 Server-to-Server，填寫穿透網址或測試網址)
ecpay.payment.return-url=${ECPAY_PAYMENT_RETURN_URL:https://httpbin.org/post}
# 綠界付款結果跳轉網址 (前端按鈕跳轉，直接導向前端頁面避開 ngrok 攔截)
ecpay.payment.result-url=${ECPAY_PAYMENT_RESULT_URL:https://starlight-hotel.vercel.app/room-checkout?paymentSuccess=true}

# 前端網址
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://starlight-hotel.vercel.app}
app.frontend.checkout-url=${APP_FRONTEND_CHECKOUT_URL:https://starlight-hotel.vercel.app/room-checkout}
